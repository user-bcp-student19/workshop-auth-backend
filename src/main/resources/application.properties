quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
%test.quarkus.http.cors.origins=http://localhost:4200
%prod.quarkus.http.cors.origins=${AUTH_CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
%dev.auth.token.secret=${AUTH_TOKEN_SECRET}
%test.auth.token.secret=test-only-auth-token-secret-2026-9d4d8f5b2a6c7e1f
%prod.auth.token.secret=${AUTH_TOKEN_SECRET}
